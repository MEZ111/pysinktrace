[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pysinktrace"
version = "0.1.0"
description = "Explainable source-to-sink tracing for focused Python security review."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
pysinktrace = "pysinktrace:main"

[tool.setuptools]
py-modules = ["pysinktrace"]
package-dir = {"" = "src"}
